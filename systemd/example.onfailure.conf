# Drop-in for a unit a seat owns, e.g. /etc/systemd/system/my-sync.service.d/onfailure.conf
# When the unit gives up, route it to the owning seat instead of failing silently.
# With Restart= and StartLimitBurst=, "failed" fires only after the retries are exhausted.
[Unit]
OnFailure=seat-alert@%n.service
